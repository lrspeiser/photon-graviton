name: SM-1 screened memory
on:
  workflow_dispatch:
  push:
    paths:
      - 'research_work/results/screened-memory/model.py'
      - 'research_work/results/screened-memory/run.py'
      - '.github/workflows/screened-memory.yml'
permissions:
  contents: read
jobs:
  construct-and-measure:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install numpy==2.3.5 scipy==1.17.0
      - name: Frozen algebra, reciprocal dynamics, SPARC screen, and disk fields
        run: python research_work/results/screened-memory/run.py --sparc --disks --output-dir /tmp/sm1-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sm1-results-${{ github.sha }}
          path: /tmp/sm1-results
          if-no-files-found: warn
