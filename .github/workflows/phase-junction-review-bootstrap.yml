name: Phase Junction baseline repair and full verification

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/phase-junction-review-bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: phase-junction-baseline-maintenance
  cancel-in-progress: false

jobs:
  repair-and-verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            phase_junction_network
            .github
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==2.4.6 scipy==1.17.1
      - name: Guarded source repair, without modifying historical results
        run: python phase_junction_network/validation/repair_baseline_source.py
      - name: Quick regression, separately identified
        run: |
          python phase_junction_network/microscopic/check_fermionic_multipair_vacuum.py --quick --output phase_junction_network/validation/results/multipair_quick.json
          python phase_junction_network/validation/check_fixed_cutoff.py --quick --output phase_junction_network/validation/results/fixed_cutoff_quick.json
      - name: Full four-pair verification, not the quick surrogate
        run: |
          python phase_junction_network/microscopic/check_fermionic_multipair_vacuum.py --output phase_junction_network/validation/results/multipair_full.json
          python phase_junction_network/validation/check_fixed_cutoff.py --output phase_junction_network/validation/results/fixed_cutoff_full.json
      - name: Verify immutable baseline and commit only validated paths
        run: |
          git diff --exit-code -- phase_junction_network/microscopic/fermionic_multipair_vacuum_results.json
          git add phase_junction_network/microscopic/check_fermionic_multipair_vacuum.py phase_junction_network/validation/results
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Repair multipair quick fit and freeze full fixed-Hamiltonian verification'
            git push origin HEAD:main
          fi
          git rev-parse HEAD
      - name: Retain exact reviewed source and run outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-junction-baseline-source-and-results
          path: |
            phase_junction_network
            .github/workflows
          include-hidden-files: true
          retention-days: 30
