name: CM-1 microscopic memory
on:
  workflow_dispatch:
  push:
    paths:
      - 'phase_junction_network/microscopic/check_companion_memory.py'
      - '.github/workflows/companion-memory.yml'
permissions:
  contents: read
jobs:
  exact-memory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install numpy==2.3.5 scipy==1.17.0
      - run: python phase_junction_network/microscopic/check_companion_memory.py --output-dir /tmp/cm1-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cm1-results-${{ github.sha }}
          path: /tmp/cm1-results
          if-no-files-found: warn
