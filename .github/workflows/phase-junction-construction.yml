name: Phase Junction area and stress construction

on:
  push:
    branches: [main]
    paths:
      - 'phase_junction_network/construction/**'
      - 'phase_junction_network/microscopic/**'
      - 'phase_junction_network/validation/check_shared_matter_ir.py'
      - '.github/workflows/phase-junction-construction.yml'
  pull_request:
    paths:
      - 'phase_junction_network/construction/**'
      - 'phase_junction_network/microscopic/**'
      - 'phase_junction_network/validation/check_shared_matter_ir.py'
      - '.github/workflows/phase-junction-construction.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  construct:
    name: construction-${{ matrix.mode }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        mode: [quick, full]
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MODE: ${{ matrix.mode }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            phase_junction_network
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==2.4.6 scipy==1.17.1
      - name: Execute declared construction and failure controls
        run: |
          FLAGS=()
          if [ "$MODE" = quick ]; then FLAGS=(--quick); fi
          mkdir -p /tmp/construction
          for TRACK in area_stress area_kernel geometry_response; do
            python "phase_junction_network/construction/check_${TRACK}.py" "${FLAGS[@]}" --output "/tmp/construction/${TRACK}.json"
          done
          git diff --exit-code
          python - <<'PY'
          from pathlib import Path
          import hashlib
          path=Path('phase_junction_network/microscopic/fermionic_multipair_vacuum_results.json')
          assert hashlib.sha256(path.read_bytes()).hexdigest()=='9fc66061e31fe53c4b8a016c5bda9eda8a5f00e0d7efa044314a443a1b5d9400'
          PY
      - name: Retain results with physical gate failures explicit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-junction-construction-${{ matrix.mode }}
          path: /tmp/construction
          retention-days: 30
