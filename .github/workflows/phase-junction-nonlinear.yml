name: Phase Junction nonlinear checks

on:
  push:
    branches: [main]
    paths:
      - "phase_junction_network/microscopic/check_nonlinear_volume_reduction.py"
      - "phase_junction_network/microscopic/nonlinear_volume_reduction_results.json"
      - "phase_junction_network/microscopic/nonlinear_volume_reduction_stage5a.md"
      - "phase_junction_network/construction/coherent_junction/check_frame_area_vertex.py"
      - "phase_junction_network/construction/coherent_junction/frame_area_vertex_results.json"
      - "phase_junction_network/construction/coherent_junction/frame_area_vertex_stage5b.md"
      - "phase_junction_network/construction/coherent_junction/check_even_odd_cone_parent.py"
      - "phase_junction_network/construction/coherent_junction/check_ring_family_cone_no_go.py"
      - "phase_junction_network/construction/coherent_junction/check_common_chiral_generator.py"
      - "phase_junction_network/construction/coherent_junction/check_chiral_boson_positivity.py"
      - "phase_junction_network/construction/coherent_junction/check_finite_weyl_duality_lock.py"
      - "phase_junction_network/validation/check_nonlinear_constraint_closure.py"
      - "phase_junction_network/validation/results/nonlinear_constraint_closure_full.json"
      - "phase_junction_network/validation/nonlinear_constraint_closure_stage5c.md"
      - "phase_junction_network/validation/check_finite_weyl_coherent_frame.py"
      - "phase_junction_network/validation/check_fock_frame_cone_response.py"
      - "phase_junction_network/validation/NONLINEAR_CHECKPOINT.md"
      - ".github/workflows/phase-junction-nonlinear.yml"
  pull_request:
    paths:
      - "phase_junction_network/microscopic/check_nonlinear_volume_reduction.py"
      - "phase_junction_network/construction/coherent_junction/check_frame_area_vertex.py"
      - "phase_junction_network/construction/coherent_junction/check_even_odd_cone_parent.py"
      - "phase_junction_network/construction/coherent_junction/check_ring_family_cone_no_go.py"
      - "phase_junction_network/construction/coherent_junction/check_common_chiral_generator.py"
      - "phase_junction_network/construction/coherent_junction/check_chiral_boson_positivity.py"
      - "phase_junction_network/construction/coherent_junction/check_finite_weyl_duality_lock.py"
      - "phase_junction_network/validation/check_nonlinear_constraint_closure.py"
      - "phase_junction_network/validation/check_finite_weyl_coherent_frame.py"
      - "phase_junction_network/validation/check_fock_frame_cone_response.py"
      - ".github/workflows/phase-junction-nonlinear.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-nonlinear-gravity:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install numerical dependencies
        run: python -m pip install --upgrade pip numpy scipy

      - name: Check nonlinear homogeneous fixed-volume reduction
        run: |
          python phase_junction_network/microscopic/check_nonlinear_volume_reduction.py \
            --samples 200 \
            --seed 57 \
            --output /tmp/nonlinear_volume_reduction_results.json

      - name: Check coherent frame-area curvature vertex
        run: |
          python phase_junction_network/construction/coherent_junction/check_frame_area_vertex.py \
            --quick \
            --output /tmp/frame_area_vertex_results.json

      - name: Check coherent even-odd cone parent
        run: |
          python phase_junction_network/construction/coherent_junction/check_even_odd_cone_parent.py \
            --output /tmp/even_odd_cone_parent.json

      - name: Check coherent ring-family cone no-go
        run: |
          python phase_junction_network/construction/coherent_junction/check_ring_family_cone_no_go.py \
            --output /tmp/ring_family_cone_no_go.json

      - name: Check common chiral photon-frame generator
        run: |
          python phase_junction_network/construction/coherent_junction/check_common_chiral_generator.py \
            --output /tmp/common_chiral_generator.json

      - name: Check chiral boson positivity and duality candidate
        run: |
          python phase_junction_network/construction/coherent_junction/check_chiral_boson_positivity.py \
            --output /tmp/chiral_boson_positivity.json

      - name: Check finite Weyl self-duality lock
        run: |
          python phase_junction_network/construction/coherent_junction/check_finite_weyl_duality_lock.py \
            --output /tmp/finite_weyl_duality_lock.json

      - name: Check nonlinear constraint closure and local obstruction
        run: |
          python phase_junction_network/validation/check_nonlinear_constraint_closure.py \
            --quick \
            --output /tmp/nonlinear_constraint_closure_results.json

      - name: Check finite Weyl coherent-frame realization
        run: |
          python phase_junction_network/validation/check_finite_weyl_coherent_frame.py \
            --quick \
            --output /tmp/finite_weyl_coherent_frame_results.json

      - name: Check antisymmetric Fock photon-frame response
        run: |
          python phase_junction_network/validation/check_fock_frame_cone_response.py \
            --quick \
            --output /tmp/fock_frame_cone_response.json
